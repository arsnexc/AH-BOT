name: Build AhProfit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ahprofit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests and build remapped mod JAR
        run: ./gradlew --no-daemon clean test build

      - name: Upload the mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ahprofit-mod-${{ github.sha }}
          path: |
            build/libs/ahprofit-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
