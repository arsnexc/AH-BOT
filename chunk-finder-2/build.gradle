plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { }
loom {
    splitEnvironmentSourceSets()
    mods {
        "chunkfinder" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
def modVersion = project.version.toString()
processResources {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") { expand "version": modVersion }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
def modArchiveName = project.archives_base_name.toString()
jar {
    from("LICENSE") { rename { "${it}_${modArchiveName}" } }
}
publishing {
    publications {
        create("mavenJava", MavenPublication) { from components.java }
    }
}
